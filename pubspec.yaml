name: newdemo
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  flutter_dotenv: ^5.1.0
  firebase_core: ^3.9.0
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.6.0
  google_fonts: ^6.2.1
  image_picker: ^1.0.4
  firebase_storage: ^12.3.5
  provider: ^6.0.0
  tmdb_api: ^2.1.5
  http: ^1.1.0
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  flutterfire_cli: ^1.3.1

flutter_icons:
  android: true
  ios: true
  image_path: "lib/assets/images/logo.jpg"

flutter:
  uses-material-design: true
  assets:
    - .env
    - lib/assets/images/logo.jpg
    - lib/assets/images/backgroundoflogin.png
